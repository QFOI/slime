# Used by slime's train.py; this is not an external-API evaluation config.
tasks: [../tasks/panda-reach, ../tasks/panda-lift]
agents: [cc, dsh]
profiles: [intuitive, expert]
training:
  enabled: true
image: slime-robotics:0.1
output_dir: ../runs/training
max_model_requests: 16
runtime:
  # Actual actor/router and sampling are controlled by slime's train arguments.
  # External runtime.models/backend credentials are never used for training.
  prompt:
    user: Complete the task using the available tools and verify the physical result.
  claude:
    expected_version: 2.1.296
    max_turns: 16
    context_window: 16384
    max_output_tokens: 2048
    thinking_budget: 0
    compaction: {enabled: false, threshold_pct: 70, max_compactions: 0}
    multiagent: {enabled: false}
  dsh:
    expected_version: 0.1.0-rc.6
    acp_version: 0.1.0-rc.6
    context_window: 16384
    max_model_requests: 16
    max_output_tokens: 2048
    compaction_enabled: false
  run:
    timeout_sec: 600
    api_trace: false
